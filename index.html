<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121816" />
    <script>
      try {
        const raw = JSON.parse(localStorage.getItem("williz-math-v1"));
        const learner = raw?.lastLearner;
        const theme = raw?.people?.[learner]?.theme;
        if (theme === "light") document.documentElement.dataset.theme = "light";
      } catch {
        // First visit stays on the default dark theme.
      }
    </script>
    <meta
      name="description"
      content="WilLiz Math — a focused arithmetic practice studio for addition, subtraction, multiplication, and division."
    />
    <title>WilLiz Math</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,680&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="action-bar">
        <button type="button" id="session-back" class="icon-btn" hidden aria-label="Back">←</button>
        <div class="action-start" id="action-home">
          <div class="learner-menu" id="learner-menu">
            <button
              type="button"
              id="learner-btn"
              class="icon-btn avatar-btn"
              aria-expanded="false"
              aria-controls="learner-panel"
              aria-label="Will, change who is practicing"
            >
              <span id="learner-avatar" class="avatar" aria-hidden="true">W</span>
            </button>
            <div id="learner-panel" class="learner-panel hidden" hidden role="menu" aria-label="Who is practicing">
              <button type="button" class="learner-option is-selected" data-learner="Will" role="menuitem">Will</button>
              <button type="button" class="learner-option" data-learner="Liz" role="menuitem">Liz</button>
              <button type="button" class="learner-option" data-learner="Guest" role="menuitem">Guest</button>
            </div>
          </div>
          <h1 class="app-title">WilLiz Math</h1>
        </div>
        <p id="play-stat" class="play-stat" hidden aria-live="polite">0/0</p>
        <button
          type="button"
          id="settings-btn"
          class="icon-btn"
          aria-expanded="false"
          aria-controls="settings-screen"
          aria-label="Open settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M10.1 2.6 9.4 5a7.6 7.6 0 0 0-1.6.9l-2.4-.7-1.8 3.1 1.8 1.7a7 7 0 0 0 0 1.9L3.6 13.6l1.8 3.1 2.4-.7c.5.4 1 .7 1.6.9l.7 2.4h3.6l.7-2.4c.6-.2 1.1-.5 1.6-.9l2.4.7 1.8-3.1-1.8-1.7a7 7 0 0 0 0-1.9l1.8-1.7-1.8-3.1-2.4.7a7.6 7.6 0 0 0-1.6-.9l-.7-2.4h-3.6Zm1.9 6.6a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6Z"
            />
          </svg>
        </button>
      </header>

      <main>
        <section id="settings-screen" class="panel hidden" aria-labelledby="setup-title">
          <div class="settings-head">
            <button type="button" id="settings-back" class="icon-btn" aria-label="Back">←</button>
            <h2 id="setup-title">Settings</h2>
          </div>

          <fieldset class="block">
            <legend>Operations</legend>
            <div class="chip-row" id="op-row" role="group" aria-label="Operations">
              <button type="button" class="chip is-selected" data-op="add" aria-pressed="true">+</button>
              <button type="button" class="chip is-selected" data-op="sub" aria-pressed="true">−</button>
              <button type="button" class="chip" data-op="mul" aria-pressed="false">×</button>
              <button type="button" class="chip" data-op="div" aria-pressed="false">÷</button>
            </div>
          </fieldset>

          <fieldset class="block">
            <legend>Difficulty</legend>
            <div class="seg" id="difficulty-row" role="radiogroup" aria-label="Difficulty">
              <button type="button" class="seg-btn is-selected" data-difficulty="easy" aria-checked="true">Easy</button>
              <button type="button" class="seg-btn" data-difficulty="pictures" aria-checked="false">Pictures</button>
              <button type="button" class="seg-btn" data-difficulty="medium" aria-checked="false">Medium</button>
              <button type="button" class="seg-btn" data-difficulty="hard" aria-checked="false">Hard</button>
              <button type="button" class="seg-btn" data-difficulty="challenge" aria-checked="false">Challenge</button>
            </div>
          </fieldset>

          <fieldset class="block">
            <legend>Appearance</legend>
            <div class="seg theme-row" id="theme-row" role="radiogroup" aria-label="Appearance">
              <button type="button" class="seg-btn is-selected" data-theme="dark" aria-checked="true">Dark</button>
              <button type="button" class="seg-btn" data-theme="light" aria-checked="false">Light</button>
            </div>
          </fieldset>

          <fieldset class="block">
            <legend>Mode</legend>
            <div class="mode-grid" id="mode-row">
              <button type="button" class="mode-card is-selected" data-mode="practice">
                <strong>Practice</strong>
                <span>Unlimited questions, retry allowed</span>
              </button>
              <button type="button" class="mode-card" data-mode="quiz10">
                <strong>Quiz · 10</strong>
                <span>One try each, then the score</span>
              </button>
              <button type="button" class="mode-card" data-mode="quiz20">
                <strong>Quiz · 20</strong>
                <span>A longer set for stamina</span>
              </button>
              <button type="button" class="mode-card" data-mode="sprint">
                <strong>60s sprint</strong>
                <span>Answer as many as you can</span>
              </button>
            </div>
          </fieldset>

          <p id="setup-error" class="error" hidden>Choose at least one operation to start.</p>
        </section>

        <section id="setup-screen" class="panel" aria-labelledby="home-title">
          <h2 id="home-title">Ready when you are</h2>
          <p id="mix-summary" class="mix-summary"></p>
          <button type="button" id="start-btn" class="primary">Start practicing</button>
        </section>

        <section id="play-screen" class="panel hidden" aria-labelledby="problem">
          <div class="play-meta">
            <p id="play-who"></p>
            <p id="play-progress" aria-live="polite"></p>
          </div>
          <p class="problem-label">Solve</p>
          <div id="problem" class="problem" aria-live="polite"></div>
          <form id="answer-form" class="answer-form is-sheet-fill">
            <label class="sr-only" for="answer-input">Answer</label>
            <input
              id="answer-input"
              name="answer"
              hidden
              readonly
              tabindex="-1"
              inputmode="none"
              autocomplete="off"
              aria-readonly="true"
              aria-describedby="feedback"
            />
            <button type="submit" class="primary compact">Submit</button>
          </form>
          <p id="feedback" class="feedback" aria-live="assertive"></p>
          <div class="keypad" id="keypad" aria-hidden="true">
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="-">−</button>
            <button type="button" data-key="0">0</button>
            <button type="button" data-key="back">⌫</button>
          </div>
          <div class="play-actions">
            <button type="button" id="end-btn" class="ghost">End round</button>
          </div>
          <div id="star-row" class="star-row" hidden aria-label="Correct progress"></div>
        </section>

        <section id="results-screen" class="panel hidden" aria-labelledby="results-title">
          <h2 id="results-title">Round complete</h2>
          <p id="results-headline" class="results-headline"></p>
          <dl class="stats">
            <div>
              <dt>Correct</dt>
              <dd id="stat-correct">0</dd>
            </div>
            <div>
              <dt>Accuracy</dt>
              <dd id="stat-accuracy">0%</dd>
            </div>
            <div>
              <dt>Best streak</dt>
              <dd id="stat-streak">0</dd>
            </div>
            <div>
              <dt>Time</dt>
              <dd id="stat-time">0s</dd>
            </div>
          </dl>
          <p id="stat-best" class="best-note"></p>
          <div class="result-actions">
            <button type="button" id="again-btn" class="primary">Play again</button>
            <button type="button" id="setup-btn" class="ghost">Change setup</button>
          </div>
        </section>
      </main>

      <div id="leave-backdrop" class="leave-backdrop hidden" hidden></div>
      <div
        id="leave-dialog"
        class="leave-dialog hidden"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="leave-title"
      >
        <h2 id="leave-title">Leave practice?</h2>
        <p>This session is still going. Leave anyway?</p>
        <div class="leave-actions">
          <button type="button" id="leave-stay" class="ghost">Stay</button>
          <button type="button" id="leave-confirm" class="primary">Leave</button>
        </div>
      </div>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
